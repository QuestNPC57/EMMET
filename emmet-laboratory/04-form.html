<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <input type="text" name="" id=""><br>
    <input type="email" name="" id=""><br>
    <input type="password" name="" id=""><br>
    <input type="checkbox" name="" id=""><br>
    <input type="radio" name="" id=""><br>
    <input type="submit" value=""><br>

    <hr>
    <form action="answers.html">
        <label for="SID">Student ID</label><br>
        <input type="text" name="SID" id="SID"><br>
        <label for="FN">Full Name</label><br>
        <input type="text" name="FN" id="FN"><br>
        <label for="Email">Email</label><br>
        <input type="email" name="email" id="email"></br>
        <label for="Password">Password</label><br>
        <input type="password" name="password" id="password"></br>
        <label for="gender">Gender</label><br>
        <input type="radio" name="gender" id="male">Male
        <input type="radio" name="gender" id="female">Female
        <input type="radio" name="gender" id="other">Other<br>
        <label for="course">Course</label><br>
        <input type="radio" name="course" id="bsit">BSIT
        <input type="radio" name="course" id="bscs">BSCS
        <input type="radio" name="course" id="bsce">BSCE<br>
        <label for="hobbies">Hobbies</label><br>
        <input type="checkbox" name="hobby" id="va">Visual Arts.
        <input type="checkbox" name="hobby" id="fat">Fiber and Textiles.
        <input type="checkbox" name="hobby" id="hc">Handicrafts.
        <input type="checkbox" name="hobby" id="wam">Writing and Media.
        <input type="checkbox" name="hobby" id="fam">Fitness and Movement.
        <input type="checkbox" name="hobby" id="sports">Sports.
        <input type="checkbox" name="hobby" id="naa">Nature and Adventure.
        <input type="checkbox" name="hobby" id="tac">Tabletop and Cards.
        <input type="checkbox" name="hobby" id="d">Digital.
        <input type="checkbox" name="hobby" id="mal">Mind and Learning.
        <input type="checkbox" name="hobby" id="cab">Cooking and baking.<br>
        <label for="address">Address</label><br>
        <input type="text" name="address" id="address"><br>
        <input type="submit" value="submit">
    </form>
</body>

</html>
